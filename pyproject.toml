[project]
name = "gmri2fem"
authors = [{ name = "Jørgen Riseth", email = "jnriseth@gmail.com" }]
version = "0.3.1"
requires-python = ">=3.11,<3.13"
description = "Processing pipeline for glymphatic MRI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "loguru",
  "matplotlib",
  "meshio",
  "nibabel",
  "numpy",
  "pandas",
  "pint",
  "pydicom",
  "pymeshfix",
  "scikit-image",
  "scipy",
  "tqdm",
  "simple-mri>=0.1.6",
  "click",
  "vtk",
  "pyvista[all]",
]

[project.scripts]
gmri2fem = "_cli:gmri2fem"

[project.urls]
Homepage = "https://github.com/jorgenriseth/gMRI2FEM.git"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"

[tool.pixi.workspace]
channels = [
  "conda-forge/label/fenics-dev",
  "conda-forge",
  "jorgenriseth",
  "bioconda",
]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
gmri2fem = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m pytest --ignore=tests/test_fsl.py"
release-check = "python scripts/release.py check"
release-build = "python scripts/release.py build"
release-conda = "python scripts/release.py conda"

[tool.pixi.dependencies]
fenics = ">=2019.2.0.dev20240219,<2020"
svmtk = ">=1.3.0"
h5py = ">=3,<4"

[tool.pixi.feature.test.dependencies]
pytest = ">=8,<9"
packaging = ">=24,<26"
pyyaml = ">=6,<7"
jinja2 = ">=3.1,<4"

[tool.pixi.feature.release.dependencies]
python = "3.11.*"
python-build = ">=1.2,<2"
twine = ">=6,<7"
conda-build = ">=25,<26"
anaconda-client = ">=1.13,<2"
packaging = ">=24,<26"
pyyaml = ">=6,<7"
jinja2 = ">=3.1,<4"
pytest = ">=8,<9"

[tool.pixi.feature.release.activation.env]
CONDA_SOLVER = "libmamba"
CONDA_CHANNEL_PRIORITY = "strict"

[tool.pixi.environments]
default = ["test"]
release = { features = ["release"], no-default-feature = true }
