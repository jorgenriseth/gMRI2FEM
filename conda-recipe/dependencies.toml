# Only Python requirements that need a deliberate Conda translation belong
# here. All other Python requirements are derived from pyproject.toml.
[overrides]
"pyvista[all]" = [
  "pyvista >=0.44,<0.45", "cmocean", "colorcet", "imageio", "meshio >=5.2",
  "ipywidgets", "jupyter-server-proxy", "nest-asyncio",
  "trame >=2.5.2", "trame-client >=2.12.7", "trame-server >=2.11.7",
  "trame-vtk >=2.5.8", "trame-vuetify >=2.3.1",
]
vtk = ["vtk <9.4"]

[override_reasons]
"pyvista[all]" = "Expand the PyVista all extra for Conda and retain the Gonzo-tested 0.44 API."
vtk = "Newer VTK lacks vtkCapsuleSource required by PyVista 0.44; retain Gonzo's tested pre-9.4 stack."

# Dependencies needed by the native Conda build that are not in Python metadata.
[native]
fenics = ">=2019.2.0.dev20240219,<2020"
svmtk = ">=1.3.0"
