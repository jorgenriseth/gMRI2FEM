{% set project = load_file_data(RECIPE_DIR ~ '/../source/pyproject.toml')['project'] %}
{% set deps = load_file_data(RECIPE_DIR ~ '/dependencies.toml') %}

package:
  name: {{ project['name'] }}
  version: "{{ project['version'] }}"

source:
  path: ../source

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  entry_points:
    - gmri2fem = _cli:gmri2fem

requirements:
  host:
    - python 3.11.*
    - setuptools >=77.0.3
    - pip
  run:
    - python {{ project['requires-python'] }}
    {% for requirement in project['dependencies'] %}
    {% if requirement in deps.get('overrides', {}) %}
    {% for translation in deps['overrides'][requirement] %}
    - {{ translation }}
    {% endfor %}
    {% else %}
    - {{ requirement | replace('>=', ' >=') }}
    {% endif %}
    {% endfor %}
    {% for name, constraint in deps['native'].items() %}
    - {{ name }} {{ constraint }}
    {% endfor %}

test:
  imports:
    - _cli
    - brainmeshing
    - dti
    - fenics_io
    - gmri2fem
    - i2m
  source_files:
    - tests/test_cli.py
    - tests/test_native_integration_smoke.py
  commands:
    - python -m pip check
    - gmri2fem --help
    - python -m pytest -q tests/test_cli.py tests/test_native_integration_smoke.py
  requires:
    - python 3.11.*
    - pip
    - pytest

about:
  summary: "{{ project['description'] }}"
  home: "{{ project['urls']['Homepage'] }}"
  license: "{{ project['license'] }}"
  license_file: LICENSE
